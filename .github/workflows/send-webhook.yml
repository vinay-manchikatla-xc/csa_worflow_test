name: Send Webhook to Customer Support Assistant

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send webhook to Customer Support Assistant
        run: |
          # Get the changed files from the push event
          ADDED_FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[].added[]' | jq -Rs '.')
          MODIFIED_FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[].modified[]' | jq -Rs '.')
          REMOVED_FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[].removed[]' | jq -Rs '.')

          # Build the webhook payload
          PAYLOAD=$(cat <<EOF
          {
            "ref": "${{ github.ref }}",
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "commits": [
              {
                "added": $ADDED_FILES,
                "modified": $MODIFIED_FILES,
                "removed": $REMOVED_FILES
              }
            ]
          }
          EOF
          )

          # Generate HMAC-SHA256 signature
          SECRET="${{ secrets.WEBHOOK_SECRET }}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print "sha256="$2}')

          # Send the webhook request
          curl -X POST "${{ secrets.WEBHOOK_URL }}/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -H "x-hub-signature-256: $SIGNATURE" \
            -d "$PAYLOAD"

          echo "Webhook sent with signature: $SIGNATURE"
