name: Send Webhook to Customer Support Assistant

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send webhook to Customer Support Assistant
        run: |
          # Get the changed files from the push event as JSON arrays
          ADDED_FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '[.[].added[] | select(. != null)]')
          MODIFIED_FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '[.[].modified[] | select(. != null)]')
          REMOVED_FILES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '[.[].removed[] | select(. != null)]')

          # Build the webhook payload
          PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg repo "${{ github.repository }}" \
            --argjson added "$ADDED_FILES" \
            --argjson modified "$MODIFIED_FILES" \
            --argjson removed "$REMOVED_FILES" \
            '{
              ref: $ref,
              repository: { full_name: $repo },
              commits: [{ added: $added, modified: $modified, removed: $removed }]
            }')

          # Generate HMAC-SHA256 signature
          SECRET="${{ secrets.WEBHOOK_SECRET }}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print "sha256="$2}')

          # Send the webhook request
          curl -X POST "${{ secrets.WEBHOOK_URL }}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -H "x-hub-signature-256: $SIGNATURE" \
            -d "$PAYLOAD"

          echo "Webhook sent with signature: $SIGNATURE"
