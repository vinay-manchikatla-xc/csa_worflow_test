name: Sync Documentation to Vector DB

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  sync-documentation:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build documentation change payload
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          # Get all files changed between the previous and current
          # commit of main.
          #
          # --name-status gives:
          #
          # A <file>   -> added
          # M <file>   -> modified
          # D <file>   -> deleted
          #
          # We restrict the diff to documentation/.
          git diff --name-status "$BEFORE" "$AFTER" -- documentation/ > /tmp/documentation-changes.txt

          echo ""
          echo "Documentation changes:"
          cat /tmp/documentation-changes.txt || true

          ADDED='[]'
          MODIFIED='[]'
          REMOVED='[]'

          while IFS=$'\t' read -r STATUS FILE EXTRA; do
            [ -z "${FILE:-}" ] && continue

            case "$STATUS" in
              A)
                ADDED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$ADDED")
                ;;

              M)
                MODIFIED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$MODIFIED")
                ;;

              D)
                REMOVED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$REMOVED")
                ;;

              R*)
                # Rename:
                # EXTRA = old path
                # FILE  = new path
                #
                # Treat it as delete + add.
                if [ -n "${EXTRA:-}" ]; then
                  REMOVED=$(jq \
                    --arg file "$EXTRA" \
                    '. + [$file]' \
                    <<< "$REMOVED")
                fi

                ADDED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$ADDED")
                ;;

              *)
                echo "Ignoring unsupported status: $STATUS $FILE"
                ;;
            esac
          done < /tmp/documentation-changes.txt

          COMMITS=$(jq -cn \
            --argjson added "$ADDED" \
            --argjson modified "$MODIFIED" \
            --argjson removed "$REMOVED" \
            '[
              {
                added: $added,
                modified: $modified,
                removed: $removed
              }
            ]')

          echo ""
          echo "Generated change payload:"
          echo "$COMMITS" | jq .

          # Store multiline JSON safely as GitHub Actions output.
          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.event.after }}
          COMMITS: ${{ steps.changes.outputs.commits }}
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -cn \
            --arg ref "$REF" \
            --arg after "$AFTER" \
            --arg repository "$REPOSITORY" \
            --argjson commits "$COMMITS" \
            '{
              ref: $ref,
              after: $after,
              repository: {
                full_name: $repository
              },
              commits: $commits
            }')

          echo "========================================"
          echo "Webhook payload"
          echo "========================================"

          echo "$PAYLOAD" | jq .

          # Generate HMAC-SHA256 from the exact bytes
          # that will be sent to the backend.
          SIGNATURE=$(
            printf '%s' "$PAYLOAD" |
            openssl dgst \
              -sha256 \
              -hmac "$WEBHOOK_SECRET" |
            awk '{print "sha256=" $2}'
          )

          RESPONSE_FILE=$(mktemp)

          HTTP_STATUS=$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --url "${WEBHOOK_URL}/api/webhooks/github" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Event: push" \
              --header "X-Hub-Signature-256: ${SIGNATURE}" \
              --data-raw "$PAYLOAD" \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}"
          )

          echo ""
          echo "HTTP status: $HTTP_STATUS"

          echo "Webhook response:"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Webhook request failed."
            exit 1
          fi

          echo ""
          echo "Documentation synchronization webhook sent successfully."