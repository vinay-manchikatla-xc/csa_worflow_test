name: Sync Documentation to Vector DB

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  sync-documentation:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Collect documentation changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          echo "Repository: $REPOSITORY"
          echo "Before: $BEFORE"
          echo "After: $AFTER"

          echo "Getting changed files..."

          # Get the files changed between the previous commit
          # and the current commit.
          #
          # GitHub returns files with statuses such as:
          # A = added
          # M = modified
          # D = removed
          # R = renamed
          FILES=$(gh api \
            "repos/${REPOSITORY}/compare/${BEFORE}...${AFTER}" \
            --paginate \
            --jq '.files[] | [.status, .filename, (.previous_filename // "")] | @tsv')

          echo "Changed files:"
          echo "$FILES"

          ADDED='[]'
          MODIFIED='[]'
          REMOVED='[]'

          while IFS=$'\t' read -r STATUS FILE PREVIOUS_FILE; do

            # Ignore empty lines
            if [[ -z "$FILE" ]]; then
              continue
            fi

            # Only documentation files should be synchronized.
            if [[ "$FILE" != documentation/* && "$PREVIOUS_FILE" != documentation/* ]]; then
              continue
            fi

            case "$STATUS" in

              A)
                ADDED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$ADDED")
                ;;

              M)
                MODIFIED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$MODIFIED")
                ;;

              D)
                REMOVED=$(jq \
                  --arg file "$FILE" \
                  '. + [$file]' \
                  <<< "$REMOVED")
                ;;

              R)
                # For a rename:
                #
                # old documentation file -> removed
                # new documentation file -> added
                #
                if [[ "$PREVIOUS_FILE" == documentation/* ]]; then
                  REMOVED=$(jq \
                    --arg file "$PREVIOUS_FILE" \
                    '. + [$file]' \
                    <<< "$REMOVED")
                fi

                if [[ "$FILE" == documentation/* ]]; then
                  ADDED=$(jq \
                    --arg file "$FILE" \
                    '. + [$file]' \
                    <<< "$ADDED")
                fi
                ;;

              *)
                echo "Ignoring unsupported status: $STATUS $FILE"
                ;;

            esac

          done <<< "$FILES"

          COMMITS=$(jq -cn \
            --argjson added "$ADDED" \
            --argjson modified "$MODIFIED" \
            --argjson removed "$REMOVED" \
            '[
              {
                added: $added,
                modified: $modified,
                removed: $removed
              }
            ]')

          echo "Final changes:"
          echo "$COMMITS" | jq .

          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"

      - name: Send documentation changes to Customer Support Assistant
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          AFTER: ${{ github.event.after }}
          COMMITS: ${{ steps.changes.outputs.commits }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -cn \
            --arg ref "$REF" \
            --arg after "$AFTER" \
            --arg repository "$REPOSITORY" \
            --argjson commits "$COMMITS" \
            '{
              ref: $ref,
              after: $after,
              repository: {
                full_name: $repository
              },
              commits: $commits
            }')

          echo "========================================"
          echo "Webhook Payload"
          echo "========================================"

          echo "$PAYLOAD" | jq .

          echo "========================================"
          echo "Generating HMAC signature"
          echo "========================================"

          SIGNATURE=$(
            printf '%s' "$PAYLOAD" |
            openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" |
            awk '{print "sha256=" $2}'
          )

          echo "Signature generated successfully."

          RESPONSE_FILE=$(mktemp)

          HTTP_STATUS=$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --url "${WEBHOOK_URL}/api/webhooks/github" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Event: push" \
              --header "X-Hub-Signature-256: ${SIGNATURE}" \
              --data-raw "$PAYLOAD" \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}"
          )

          echo "HTTP Status: $HTTP_STATUS"

          echo "Webhook response:"
          cat "$RESPONSE_FILE"

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Webhook request failed."
            exit 1
          fi

          echo "Documentation synchronization webhook sent successfully."