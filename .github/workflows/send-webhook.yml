name: Send Webhook to Customer Support Assistant

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send webhook to Customer Support Assistant
        run: |
          # Get file changes from head_commit (has added/modified/removed arrays)
          ADDED=$(echo '${{ toJson(github.event.head_commit.added) }}' | jq -r '. // []')
          MODIFIED=$(echo '${{ toJson(github.event.head_commit.modified) }}' | jq -r '. // []')
          REMOVED=$(echo '${{ toJson(github.event.head_commit.removed) }}' | jq -r '. // []')

          # Build the webhook payload
          PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg repo "${{ github.repository }}" \
            --argjson added "$ADDED" \
            --argjson modified "$MODIFIED" \
            --argjson removed "$REMOVED" \
            '{
              ref: $ref,
              repository: { full_name: $repo },
              commits: [{
                added: $added,
                modified: $modified,
                removed: $removed
              }]
            }')

          echo "Payload: $PAYLOAD"

          # Generate HMAC-SHA256 signature
          SECRET="${{ secrets.WEBHOOK_SECRET }}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print "sha256="$2}')

          # Send the webhook request
          curl -X POST "${{ secrets.WEBHOOK_URL }}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -H "x-hub-signature-256: $SIGNATURE" \
            -d "$PAYLOAD"

          echo "Webhook sent with signature: $SIGNATURE"
