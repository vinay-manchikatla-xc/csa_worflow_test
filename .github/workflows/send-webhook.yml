name: Sync Documentation to Vector DB

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  sync-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Send documentation changes to Customer Support Assistant
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          echo "Processing GitHub push event..."

          # Read the original GitHub push event.
          EVENT=$(cat "$GITHUB_EVENT_PATH")

          # Extract repository information.
          REF=$(echo "$EVENT" | jq -r '.ref')
          AFTER=$(echo "$EVENT" | jq -r '.after')
          REPOSITORY=$(echo "$EVENT" | jq -r '.repository.full_name')

          echo "Repository: $REPOSITORY"
          echo "Ref: $REF"
          echo "Commit: $AFTER"

          # Extract all commits from this push.
          #
          # Only send the fields required by the backend DTO.
          COMMITS=$(echo "$EVENT" | jq -c '[
            .commits[] |
            {
              added: (.added // []),
              modified: (.modified // []),
              removed: (.removed // [])
            }
          ]')

          # Build the webhook payload.
          PAYLOAD=$(jq -cn \
            --arg ref "$REF" \
            --arg after "$AFTER" \
            --arg repository "$REPOSITORY" \
            --argjson commits "$COMMITS" \
            '{
              ref: $ref,
              after: $after,
              repository: {
                full_name: $repository
              },
              commits: $commits
            }')

          echo "Webhook payload:"
          echo "$PAYLOAD" | jq .

          # Generate HMAC-SHA256 signature.
          #
          # The signature is generated from the exact payload
          # that will be sent to the backend.
          SIGNATURE=$(
            printf '%s' "$PAYLOAD" |
            openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" |
            awk '{print "sha256=" $2}'
          )

          echo "Sending webhook..."

          RESPONSE_FILE=$(mktemp)

          HTTP_STATUS=$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --url "${WEBHOOK_URL}/api/webhooks/github" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Event: push" \
              --header "X-Hub-Signature-256: ${SIGNATURE}" \
              --data-raw "$PAYLOAD" \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}"
          )

          echo "HTTP Status: $HTTP_STATUS"

          echo "Webhook response:"
          cat "$RESPONSE_FILE"

          # Fail the workflow for any non-2xx response.
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Webhook request failed."
            exit 1
          fi

          echo "Documentation synchronization webhook sent successfully."