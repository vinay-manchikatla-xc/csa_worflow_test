name: Send Webhook to Customer Support Assistant

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send webhook to Customer Support Assistant
        run: |
          # Build the webhook payload directly from GitHub context
          PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref }}" \
            --arg repo "${{ github.repository }}" \
            --argjson commits '${{ toJson(github.event.commits) }}' \
            '{
              ref: $ref,
              repository: { full_name: $repo },
              commits: [$commits[] | {
                added: (.added // []),
                modified: (.modified // []),
                removed: (.removed // [])
              }]
            }')

          # Generate HMAC-SHA256 signature
          SECRET="${{ secrets.WEBHOOK_SECRET }}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print "sha256="$2}')

          # Send the webhook request
          curl -X POST "${{ secrets.WEBHOOK_URL }}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -H "x-hub-signature-256: $SIGNATURE" \
            -d "$PAYLOAD"

          echo "Webhook sent with signature: $SIGNATURE"
